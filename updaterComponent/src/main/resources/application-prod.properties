# AWS. Every connection setting and secret is a required env var (no defaults):
# a missing one fails start-up. How they are injected (e.g. ECS task definition
# + Secrets Manager) is decided with the deployment; see NEXT_STEPS.md.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Elastic Cloud (ES 9.x; AWS OpenSearch is not compatible with the 9.x client).
spring.elasticsearch.uris=${ELASTICSEARCH_URIS}
spring.elasticsearch.api-key=${ELASTICSEARCH_API_KEY}

# Prod databases are always created by Flyway: an unknown schema must fail.
spring.flyway.baseline-on-migrate=false

updater.run-on-startup=false

updater.admin.stub-auth=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
updater.admin.cognito.client-ids=${COGNITO_CLIENT_IDS}
