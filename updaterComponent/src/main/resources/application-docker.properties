# The `updater` service of the root docker-compose.yml. Containers reach each
# other by compose service name, not localhost.
# Keep the dev settings in step with application-local.properties.

spring.datasource.url=jdbc:postgresql://postgres:5432/updater
spring.datasource.username=updater
spring.datasource.password=updater
spring.elasticsearch.uris=http://elasticsearch:9200

# Databases created before Flyway (by ddl-auto=update, schema identical to V1)
# are adopted as V1 instead of failing on the existing tables.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# `docker compose up` brings the data up to date: every feed runs on start-up
# (unchanged feeds are hash-skipped), then on the 03:00 cron.
updater.run-on-startup=true

# Stub mode accepts this dev token (minted with the required group).
updater.admin.stub-auth=true
updater.admin.dev-token=dev-token
