# Run from the IDE or `./mvnw spring-boot:run -Dspring-boot.run.profiles=local`
# against the databases from the root docker-compose.yml, published on localhost.
# Keep the dev settings in step with application-docker.properties.

spring.datasource.url=jdbc:postgresql://localhost:5432/updater
spring.datasource.username=updater
spring.datasource.password=updater
spring.elasticsearch.uris=http://localhost:9200

# Databases created before Flyway (by ddl-auto=update, schema identical to V1)
# are adopted as V1 instead of failing on the existing tables.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Runs only when triggered via the admin API (or by the 03:00 cron), so an IDE
# restart doesn't download every feed.
updater.run-on-startup=false

# Stub mode accepts this dev token (minted with the required group).
updater.admin.stub-auth=true
updater.admin.dev-token=dev-token
