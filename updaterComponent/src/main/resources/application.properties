spring.application.name=updaterComponent

spring.datasource.url=jdbc:postgresql://localhost:5432/updater
spring.datasource.username=updater
spring.datasource.password=updater
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.elasticsearch.uris=http://localhost:9200

updater.schedule.cron=0 0 3 * * *

# Upstream source URLs (defaults are baked in; override to use a mirror).
#   updater.jmdict.url, updater.jmnedict.url, updater.kanjidic2.url, updater.radkfile.url
# KanjiVG assets are date-stamped, so the latest GitHub release is resolved at
# run time unless a specific file is pinned:
#   updater.kanjivg.url=https://github.com/KanjiVG/kanjivg/releases/download/r20250816/kanjivg-20250816.xml.gz

# Admin API auth (token-based / OAuth2 Bearer).
# Callers must belong to this Cognito group (cognito:groups claim), else 403.
updater.admin.required-group=updater-admin
# Stub mode accepts the dev-token below (minted with the group above). To switch
# to real Cognito validation, disable it and configure the user pool + app client(s):
#   updater.admin.stub-auth=false
#   spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.<region>.amazonaws.com/<userPoolId>
#   updater.admin.cognito.client-ids=<appClientId>[,<appClientId>...]
updater.admin.stub-auth=true
updater.admin.dev-token=dev-token
