spring.application.name=updaterComponent

# Settings shared by every profile. Connection details and secrets live only in
# application-<profile>.properties, so starting without a profile fails fast
# (no datasource URL, no Cognito issuer) instead of running with dev settings.
#   local  - run from the IDE / mvnw against the compose databases on localhost
#   docker - run as the compose `updater` service (hosts are compose service names)
#   prod   - AWS; every connection setting and secret comes from an env var
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks
# that the entities match it. Never edit an applied migration: add a new V<n>__*.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

updater.schedule.cron=0 0 3 * * *
# Run every feed once (in the background) when the application is ready.
updater.run-on-startup=false

# Upstream source URLs (defaults are baked in; override to use a mirror).
#   updater.jmdict.url, updater.jmnedict.url, updater.kanjidic2.url, updater.radkfile.url
# KanjiVG assets are date-stamped, so the latest GitHub release is resolved at
# run time unless a specific file is pinned:
#   updater.kanjivg.url=https://github.com/KanjiVG/kanjivg/releases/download/r20250816/kanjivg-20250816.xml.gz

# Admin API auth (token-based / OAuth2 Bearer).
# Callers must belong to this Cognito group (cognito:groups claim), else 403.
updater.admin.required-group=updater-admin
# Real Cognito validation unless a profile turns on stub auth (local, docker).
# Cognito needs spring.security.oauth2.resourceserver.jwt.issuer-uri and
# updater.admin.cognito.client-ids (see application-prod.properties).
updater.admin.stub-auth=false

# Only the health endpoint is exposed (unauthenticated; used by the Docker healthcheck).
management.endpoints.web.exposure.include=health
