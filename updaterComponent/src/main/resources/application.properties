spring.application.name=updaterComponent

spring.datasource.url=jdbc:postgresql://localhost:5432/updater
spring.datasource.username=updater
spring.datasource.password=updater
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.elasticsearch.uris=http://localhost:9200

updater.schedule.cron=0 0 3 * * *

# Admin API auth (token-based / OAuth2 Bearer).
# Stub mode accepts the dev-token below; disable it and set the Cognito issuer
# to switch to real JWT validation:
#   updater.admin.stub-auth=false
#   spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.<region>.amazonaws.com/<userPoolId>
updater.admin.stub-auth=true
updater.admin.dev-token=dev-token
